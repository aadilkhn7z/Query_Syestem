<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Query Portal</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        height: 100vh;
        overflow: hidden;
        background: #050816;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        position: relative;
      }

      canvas {
        position: absolute;
        width: 100%;
        height: 100%;
      }

      .container {
        position: relative;
        z-index: 2;
        width: 90%;
        max-width: 520px;
        padding: 30px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        text-align: center;
        box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
      }

      h1 {
        color: #00d4ff;
        margin-bottom: 10px;
      }

      p {
        margin-bottom: 20px;
      }

      input,
      textarea {
        width: 100%;
        padding: 12px;
        margin-top: 12px;
        border: none;
        border-radius: 10px;
        background: #10182f;
        color: white;
        outline: none;
        font-size: 15px;
      }

      textarea {
        height: 100px;
        resize: none;
      }

      button {
        padding: 12px 20px;
        margin-top: 15px;
        border: none;
        border-radius: 10px;
        background: #00d4ff;
        color: black;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        opacity: 0.9;
      }

      button:disabled {
        background: gray;
        cursor: not-allowed;
      }

      .hidden {
        display: none;
      }

      #result {
        margin-top: 20px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <canvas id="network"></canvas>

    <div class="container">
      <h1>Hello Team</h1>

      <p>I am Aadil 👋</p>

      <h3>Do you have any query?</h3>

      <button onclick="showForm()">Yes</button>

      <button onclick="noQuery()">No</button>

      <div id="queryForm" class="hidden">
        <input type="text" id="name" placeholder="Enter your name" />

        <input type="text" id="process" placeholder="Mention your process" />

        <textarea id="query" placeholder="Write your query"></textarea>

        <button id="submitBtn" onclick="submitQuery()">Submit Query</button>
      </div>

      <div id="result"></div>
    </div>

    <script>
      // BACKGROUND ANIMATION

      const canvas = document.getElementById("network");

      const ctx = canvas.getContext("2d");

      canvas.width = window.innerWidth;

      canvas.height = window.innerHeight;

      const particles = [];

      for (let i = 0; i < 80; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: Math.random() - 0.5,
          vy: Math.random() - 0.5,
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < particles.length; i++) {
          let p = particles[i];

          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0 || p.x > canvas.width) p.vx *= -1;

          if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

          ctx.beginPath();

          ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);

          ctx.fillStyle = "#00d4ff";

          ctx.fill();

          for (let j = i + 1; j < particles.length; j++) {
            let q = particles[j];

            let dist = Math.hypot(p.x - q.x, p.y - q.y);

            if (dist < 120) {
              ctx.beginPath();

              ctx.moveTo(p.x, p.y);

              ctx.lineTo(q.x, q.y);

              ctx.strokeStyle = `rgba(0,212,255,${1 - dist / 120})`;

              ctx.stroke();
            }
          }
        }

        requestAnimationFrame(animate);
      }

      animate();

      // SHOW FORM

      function showForm() {
        document.getElementById("queryForm").classList.remove("hidden");
      }

      // NO QUERY

      function noQuery() {
        document.getElementById("result").innerHTML =
          "Thank you for visiting 🚀";
      }

      // PREVENT MULTIPLE SUBMIT

      let alreadySubmitted = false;

      // SUBMIT QUERY

      function submitQuery() {
        if (alreadySubmitted) {
          alert("Query already submitted");

          return;
        }

        const name = document.getElementById("name").value.trim();

        const process = document.getElementById("process").value.trim();

        const query = document.getElementById("query").value.trim();

        if (name === "" || process === "" || query === "") {
          alert("Please fill all fields");

          return;
        }

        alreadySubmitted = true;

        const submitBtn = document.getElementById("submitBtn");

        submitBtn.disabled = true;

        submitBtn.innerText = "Submitting...";

        fetch("save.php", {
          method: "POST",

          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
          },

          body: `name=${encodeURIComponent(name)}&process=${encodeURIComponent(process)}&query=${encodeURIComponent(query)}`,
        })
          .then((response) => response.text())

          .then((data) => {
            document.getElementById("result").innerHTML = data;

            submitBtn.innerText = "Submitted ✅";

            // BROWSER NOTIFICATION

            if (Notification.permission === "granted") {
              new Notification("New Query Received 🚀", {
                body: `${name} submitted a query`,
              });
            } else {
              Notification.requestPermission();
            }
          })

          .catch((error) => {
            document.getElementById("result").innerHTML =
              "<h3 style='color:red'>Submission Failed</h3>";

            alreadySubmitted = false;

            submitBtn.disabled = false;

            submitBtn.innerText = "Submit Query";
          });
      }
    </script>
  </body>
</html>
